<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Calculator</title>
    <style>
        body {
            background: linear-gradient(135deg, #fbc5d8, #ffb6c1, #e0bbe4);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Pins the title to the very top-left edge of the page */
        .page-title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            margin: 0;
            letter-spacing: 1px;
        }
        .calculator {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            backdrop-filter: blur(4px);
            border: 2px solid #ffffff;
            width: 280px;
        }
        #display {
            width: 100%;
            height: 50px;
            background: #fff5f8;
            border: 2px solid #ffb6c1;
            border-radius: 12px;
            font-size: 24px;
            text-align: right;
            padding: 5px 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            color: #555;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: #ffeff2;
            color: #666;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background: #ffb6c1;
            color: white;
            transform: scale(1.05);
        }
        button.operator {
            background: #e0bbe4;
            color: #444;
        }
        button.operator:hover {
            background: #d491dc;
            color: white;
        }
        button.equal {
            background: #b5ead7;
            grid-column: span 2;
        }
        button.equal:hover {
            background: #87d3b3;
        }
    </style>
</head>
<body>

<h1 class="page-title">CALCUTELATOR</h1>

<div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button onclick="clearDisplay()" style="grid-column: span 2; background: #ff9999; color:white;">AC</button>
        <button class="operator" onclick="appendValue('/')">&divide;</button>
        <button class="operator" onclick="appendValue('*')">&times;</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">-</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>
        
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        display.value += val;
    }

    function clearDisplay() {
        display.value = '';
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch (error) {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
